name: GitHub Pages

on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

# Deploys the WebGL build from Assignment-3-FanDashboardHUD (the latest
# quiz) as the repo's single live Pages site. Only one site can be deployed
# per repo, so this intentionally does not also build Assignment1 or
# Assignment-2-3DFan for Pages - core1 only requires Android/Windows/Unix
# desktop CI coverage for all three; Pages is a separate, single-target
# deliverable that simply now lives one folder deeper.
jobs:
  build-web:
    name: Build WebGL build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten 3.1.64
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.64"
          actions-cache-folder: .emsdk-cache

      # build_web.sh already passes -s MIN_WEBGL_VERSION=2 and fetches GLM,
      # so no flags need to be injected here.
      - name: Build the 3D Fan for WebGL
        working-directory: Assignment-3-FanDashboardHUD
        run: bash build_web.sh

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r Assignment-3-FanDashboardHUD/web/. site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
