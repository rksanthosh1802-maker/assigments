name: GitHub Pages

on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

# Builds the WebGL target for all three quizzes and deploys them as separate
# subpaths under one Pages site:
#   https://<user>.github.io/<repo>/Assignment1/
#   https://<user>.github.io/<repo>/Assignment-2-3DFan/
#   https://<user>.github.io/<repo>/Assignment-3-FanDashboardHUD/
# with a small landing page at the site root linking to each.
jobs:
  build-web:
    name: Build WebGL builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten 3.1.64
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.64"
          actions-cache-folder: .emsdk-cache

      - name: Build Assignment1 for WebGL
        working-directory: Assignment1
        run: bash build_web.sh

      - name: Build Assignment-2-3DFan for WebGL
        working-directory: Assignment-2-3DFan
        run: bash build_web.sh

      - name: Build Assignment-3-FanDashboardHUD for WebGL
        working-directory: Assignment-3-FanDashboardHUD
        run: bash build_web.sh

      - name: Assemble the site
        run: |
          mkdir -p site/Assignment1
          mkdir -p site/Assignment-2-3DFan
          mkdir -p site/Assignment-3-FanDashboardHUD
          cp -r Assignment1/web/. site/Assignment1/
          cp -r Assignment-2-3DFan/web/. site/Assignment-2-3DFan/
          cp -r Assignment-3-FanDashboardHUD/web/. site/Assignment-3-FanDashboardHUD/
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>Android Programming Quizzes</title></head>
          <body style="font-family: sans-serif; max-width: 640px; margin: 40px auto;">
            <h1>Android Programming Quizzes - WebGL builds</h1>
            <ul>
              <li><a href="Assignment1/">Assignment 1</a></li>
              <li><a href="Assignment-2-3DFan/">Assignment 2 - 3D Fan</a></li>
              <li><a href="Assignment-3-FanDashboardHUD/">Assignment 3 - Fan Dashboard HUD</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5